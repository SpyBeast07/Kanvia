services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kanvia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kanvia
      PORT: 8000
      SECRET_KEY: "change-this-to-a-secure-key-in-production"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      PORT: 3000
    depends_on:
      - backend

  caddy:
    image: caddy:latest
    ports:
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
